<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020808" />
<title>ASLIMA Premium Mosque Display</title>
<style>
:root{
  --gold:#f4c873; --gold2:#b97724; --cream:#fff2d0; --muted:rgba(255,242,208,.70);
  --green:#42ef9a; --line:rgba(244,200,115,.24); --bg:#020909; --progress:0%;
  --aura1:rgba(17,114,99,.33); --aura2:rgba(244,200,115,.16);
}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:#020909;color:var(--cream);overflow:hidden}
body{font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.fajr{--aura1:rgba(43,118,150,.31);--aura2:rgba(244,200,115,.17)}
body.dhuhr{--aura1:rgba(174,127,58,.27);--aura2:rgba(255,235,180,.18)}
body.asr{--aura1:rgba(207,117,30,.32);--aura2:rgba(244,200,115,.22)}
body.maghrib{--aura1:rgba(156,55,38,.34);--aura2:rgba(246,127,67,.22)}
body.isha{--aura1:rgba(9,72,80,.34);--aura2:rgba(61,206,144,.13)}
.app{position:fixed;inset:0;padding:4.9vh 5.25vw 4.45vh;isolation:isolate;background:
 radial-gradient(circle at 34% 34%, var(--aura1), transparent 34%),
 radial-gradient(circle at 77% 68%, var(--aura2), transparent 31%),
 linear-gradient(105deg, #020707 0%, #031110 22%, #062827 58%, #020808 100%)}
.app:before{content:"";position:absolute;inset:3.3vh 3.15vw;border-radius:2.6vh;border:1px solid rgba(244,200,115,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.035), 0 3vh 9vh rgba(0,0,0,.42);z-index:4;pointer-events:none}
.bgMosque{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.bgMosque:before{content:"";position:absolute;right:-3vw;bottom:-11vh;width:66vw;height:68vh;background:url('assets/mosque-watermark.jpeg') center bottom/contain no-repeat;opacity:.50;filter:sepia(1) saturate(1.24) hue-rotate(350deg) brightness(.47) contrast(1.28);mix-blend-mode:screen}.bgMosque:after{content:"";position:absolute;right:-4vw;bottom:-4vh;width:72vw;height:36vh;background:linear-gradient(180deg, rgba(244,200,115,.12), rgba(244,200,115,.02) 28%, transparent 64%);filter:blur(7px);opacity:.45}
.vignette{position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.63),rgba(0,0,0,.08) 38%,rgba(0,0,0,.16) 70%,rgba(0,0,0,.55)),linear-gradient(0deg,rgba(0,0,0,.54),transparent 30%,rgba(0,0,0,.26));pointer-events:none}.stars{position:absolute;inset:0;z-index:3;opacity:.34;background-image:radial-gradient(circle at 31% 10%,rgba(255,255,255,.9) 0 1px,transparent 1.6px),radial-gradient(circle at 51% 8%,rgba(244,200,115,.85) 0 1px,transparent 1.5px),radial-gradient(circle at 64% 15%,rgba(255,255,255,.7) 0 1px,transparent 1.5px),radial-gradient(circle at 84% 20%,rgba(244,200,115,.7) 0 1px,transparent 1.5px),radial-gradient(circle at 72% 9%,rgba(255,255,255,.58) 0 1px,transparent 1.5px),radial-gradient(circle at 41% 23%,rgba(255,255,255,.45) 0 1px,transparent 1.5px);pointer-events:none}
.content{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:minmax(0,1fr) min(34.2vw,510px);grid-template-rows:auto 1fr auto;column-gap:7.2vw}.top{grid-column:1/3;display:flex;justify-content:space-between;align-items:flex-start;padding:0 .6vw}.brand{color:var(--gold);font:500 clamp(18px,2.05vh,27px)/1 Georgia,serif;letter-spacing:.31em;text-shadow:0 0 3vh rgba(244,200,115,.2)}.brand small{display:block;margin-top:.42vh;text-align:center;font-size:clamp(12px,1.38vh,18px);letter-spacing:0;color:rgba(244,200,115,.86)}.status{text-align:right;color:rgba(255,242,208,.94);font-size:clamp(13px,1.55vh,20px);font-weight:760;letter-spacing:.075em;text-transform:uppercase}.live{display:inline-flex;margin-top:1.35vh;align-items:center;gap:.45em;padding:.72vh .9vw;border:1px solid rgba(66,239,154,.27);border-radius:999px;background:rgba(3,74,55,.52);color:#48f3a1;font-size:clamp(11px,1.24vh,16px);letter-spacing:.11em;box-shadow:0 0 2.8vh rgba(66,239,154,.13)}.live:before{content:"";width:.56em;height:.56em;border-radius:50%;background:#48f3a1;box-shadow:0 0 1.4vh #48f3a1}
.hero{align-self:center;padding-left:.6vw;margin-top:-1vh}.clock{font:500 clamp(104px,16.7vh,218px)/.82 Georgia,serif;letter-spacing:-.055em;color:var(--gold);white-space:nowrap;text-shadow:0 .35vh 0 rgba(255,255,255,.08),0 1.9vh 5.4vh rgba(0,0,0,.55),0 0 5vh rgba(244,200,115,.18)}.ampm{font-size:.19em;letter-spacing:0;margin-left:.32vw;color:var(--gold);vertical-align:baseline}.ornament{width:min(27vw,410px);height:2.8vh;margin:2.2vh 0 1.8vh;display:flex;align-items:center;gap:1vw;color:var(--gold)}.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.ornament span{font:400 clamp(16px,2vh,26px)/1 Georgia,serif}.nextLabel{font-size:clamp(14px,1.68vh,22px);letter-spacing:.48em;color:rgba(255,242,208,.86);font-weight:620;text-transform:uppercase}.nextName{margin-top:1.05vh;font:500 clamp(75px,10.9vh,148px)/.86 Georgia,serif;letter-spacing:.035em;color:var(--gold);text-transform:uppercase;text-shadow:0 1.6vh 4.8vh rgba(0,0,0,.55),0 0 3.4vh rgba(244,200,115,.20);animation:breathe 7s ease-in-out infinite}@keyframes breathe{50%{filter:brightness(1.11);text-shadow:0 1.6vh 4.8vh rgba(0,0,0,.55),0 0 6vh rgba(244,200,115,.33)}}.nextTime{margin-top:1.55vh;font-size:clamp(27px,4vh,56px);font-weight:480;letter-spacing:.015em;color:rgba(255,242,208,.97);font-variant-numeric:tabular-nums}.nextTime:before{content:"◷";color:var(--gold);margin-right:.72vw}.remaining{margin-top:1.55vh;font-size:clamp(22px,3vh,42px);font-weight:500;color:#42ef9a;letter-spacing:-.015em;text-shadow:0 0 2.5vh rgba(66,239,154,.24)}.progressWrap{margin-top:4.1vh;width:min(35vw,525px)}.track{position:relative;height:.74vh;border-radius:999px;background:rgba(255,242,208,.20);box-shadow:0 0 2.3vh rgba(0,0,0,.28)}.fill{position:absolute;inset:0 auto 0 0;width:var(--progress);border-radius:inherit;background:linear-gradient(90deg,#42ef9a 0%,var(--gold) 70%,rgba(244,200,115,.65));box-shadow:0 0 2.8vh rgba(244,200,115,.42)}.dot{position:absolute;top:50%;left:var(--progress);width:1.55vh;height:1.55vh;border-radius:50%;transform:translate(-50%,-50%);background:var(--gold);box-shadow:0 0 3vh rgba(244,200,115,.75)}.trackLabels{display:flex;justify-content:space-between;margin-top:1.35vh;font-size:clamp(10px,1.25vh,15px);font-weight:750;letter-spacing:.14em;text-transform:uppercase}.trackLabels span:first-child{color:#42ef9a}.trackLabels span:last-child{color:rgba(255,242,208,.60)}
.panel{align-self:center;justify-self:end;width:100%;padding:2.25vh 1.55vw;border-radius:1.65vh;border:1px solid rgba(255,242,208,.14);background:linear-gradient(180deg,rgba(0,10,10,.68),rgba(0,7,7,.48));box-shadow:inset 0 0 0 1px rgba(244,200,115,.05),0 2.2vh 6vh rgba(0,0,0,.34);backdrop-filter:blur(12px)}.row{height:9.2vh;display:grid;grid-template-columns:2.4vw 1fr auto;align-items:center;gap:1vw;border-bottom:1px solid rgba(255,242,208,.13);color:rgba(255,242,208,.95)}.row:last-child{border-bottom:0}.icon{font-size:clamp(23px,2.9vh,39px);color:rgba(255,242,208,.84);text-align:center}.row[data-name="Fajr"] .icon,.row[data-name="Fajr"].active .icon{color:var(--gold)}.pname{font-size:clamp(22px,3.0vh,42px);font-weight:510;letter-spacing:.01em;text-transform:uppercase}.ptime{font-size:clamp(22px,2.95vh,41px);font-weight:480;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.row.active .pname,.row.active .ptime{color:var(--gold)}
.bottom{grid-column:1/3;align-self:end;padding:0 .6vw}.jumuah{display:inline-flex;align-items:center;gap:1.25vw;padding:1.42vh 1.55vw;border:1px solid rgba(244,200,115,.25);border-radius:1.1vh;background:rgba(0,8,9,.47);color:rgba(255,242,208,.90);font-size:clamp(14px,1.65vh,22px);letter-spacing:.075em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}.jumuah:before{content:"▣";color:var(--gold);font-size:1.25em}.jumuah b{font-weight:620;text-transform:uppercase;color:rgba(255,242,208,.98)}.jumuah .time{color:var(--gold)}
.adminHot{position:fixed;top:0;left:0;width:20vw;height:18vh;z-index:20;background:transparent;border:0;opacity:.01}.adminPanel{position:fixed;right:4vw;bottom:4vh;z-index:30;display:none;gap:.7vw;padding:.8vh;border-radius:999px;background:rgba(0,0,0,.68);border:1px solid rgba(244,200,115,.24);backdrop-filter:blur(12px);box-shadow:0 2vh 5vh rgba(0,0,0,.45)}.adminPanel.show{display:flex}.adminPanel button{border:0;border-radius:999px;background:rgba(244,200,115,.14);color:var(--cream);padding:1vh 1.15vw;font-size:clamp(11px,1.18vh,16px);text-transform:uppercase;letter-spacing:.08em;font-weight:760}.toast{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%) translateY(3vh);z-index:40;opacity:0;transition:.25s;padding:1vh 1.2vw;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid var(--line);color:var(--cream);font-weight:700}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-aspect-ratio:1/1){.app{padding:4vh 5vw}.content{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}.top,.bottom{grid-column:1}.clock{font-size:12vh}.panel{width:100%;justify-self:stretch}.row{height:7.2vh;grid-template-columns:7vw 1fr auto}.progressWrap{width:100%}.jumuah{width:100%;justify-content:center}.bgMosque:before{width:105vw;right:-32vw;opacity:.34}.hero{margin-top:2vh}}
</style>
</head>
<body class="isha">
<div class="app">
  <div class="bgMosque"></div><div class="vignette"></div><div class="stars"></div>
  <button class="adminHot" id="adminHot" aria-label="Admin"></button>
  <main class="content">
    <header class="top"><div class="brand">ASLIMA<small>أسليمة</small></div><div class="status"><div id="dateLine">TUESDAY, JUNE 30</div><div class="live">LIVE • VRIC</div></div></header>
    <section class="hero">
      <div class="clock"><span id="clockMain">11:52</span><span class="ampm" id="clockAmPm">PM</span></div>
      <div class="ornament"><span>✧</span></div>
      <div class="nextLabel">NEXT PRAYER</div><div class="nextName" id="nextName">FAJR</div>
      <div class="nextTime" id="nextTime">5:01 AM</div><div class="remaining" id="remaining">5h 08m remaining</div>
      <div class="progressWrap"><div class="track"><div class="fill"></div><div class="dot"></div></div><div class="trackLabels"><span>Fajr</span><span>Isha</span></div></div>
    </section>
    <aside class="panel" id="prayerPanel"></aside>
    <footer class="bottom"><div class="jumuah" id="jumuah"><b>Jumu’ah Prayer</b><span class="time">1:45 PM</span><span>•</span><span class="time">3:00 PM</span><span>•</span><span class="time">4:00 PM</span></div></footer>
  </main>
  <div class="adminPanel" id="adminPanel"><button id="refreshBtn">Refresh</button><button id="testAthanBtn">Azaan</button><button id="fullscreenBtn">Fullscreen</button></div>
  <div class="toast" id="toast">Ready</div>
  <audio id="athan" preload="auto" crossorigin="anonymous"><source src="https://praytimes.org/audio/sunni/Adhan-Madinah.mp3" type="audio/mpeg"></audio>
</div>
<script>
const CONFIG={city:'Irving',country:'United States',method:2,jumuah:['1:45 PM','3:00 PM','4:00 PM']};
const DEMO={Fajr:'05:01',Sunrise:'06:23',Dhuhr:'13:32',Asr:'17:14',Maghrib:'20:40',Isha:'22:02'};
let timings={...DEMO}, lastUpdated='', fired='', demoNow=null;
const PRAYERS=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const ICONS={Fajr:'☀',Dhuhr:'☼',Asr:'☼',Maghrib:'☀',Isha:'☾'};
const $=id=>document.getElementById(id);
function now(){return demoNow?new Date(demoNow):new Date()}
function clean(t){const m=String(t||'').match(/\d{1,2}:\d{2}/);return m?m[0]:'00:00'}
function mins(t){let [h,m]=clean(t).split(':').map(Number);return h*60+m}
function to12(t){let [h,m]=clean(t).split(':').map(Number);const p=h>=12?'PM':'AM';h=h%12||12;return {text:`${h}:${String(m).padStart(2,'0')}`,period:p,full:`${h}:${String(m).padStart(2,'0')} ${p}`}}
function getNext(){const n=now(),cur=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;let best=9999,name='Fajr';PRAYERS.forEach(p=>{let d=mins(timings[p])-cur;if(d>0&&d<best){best=d;name=p}});if(best===9999){best=1440-cur+mins(timings.Fajr);name='Fajr'}return {name,seconds:Math.max(0,Math.floor(best*60))}}
function activePrayer(nextName){const i=PRAYERS.indexOf(nextName);return i<=0?'Isha':PRAYERS[i-1]}
function remaining(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>0)return `${h}h ${String(m).padStart(2,'0')}m remaining`;if(m>0)return `${m}m remaining`;return 'starting now'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function updateProgress(){try{const n=now(),cur=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,start=mins(timings.Fajr),end=mins(timings.Isha);let pct=((cur-start)/Math.max(1,end-start))*100;pct=Math.max(0,Math.min(100,pct));document.documentElement.style.setProperty('--progress',pct+'%')}catch(e){document.documentElement.style.setProperty('--progress','0%')}}
function render(){const n=now(),h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');$('clockMain').textContent=`${h%12||12}:${m}`;$('clockAmPm').textContent=h>=12?'PM':'AM';$('dateLine').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();const next=getNext(),nt=to12(timings[next.name]);$('nextName').textContent=next.name.toUpperCase();$('nextTime').textContent=nt.full;$('remaining').textContent=remaining(next.seconds);document.body.className=next.name.toLowerCase();const cur=activePrayer(next.name);$('prayerPanel').innerHTML=PRAYERS.map(p=>`<div class="row ${p===cur?'active':''}" data-name="${p}"><div class="icon">${ICONS[p]}</div><div class="pname">${p}</div><div class="ptime">${to12(timings[p]).full}</div></div>`).join('');$('jumuah').innerHTML='<b>Jumu’ah Prayer</b>'+CONFIG.jumuah.map(t=>`<span class="time">${t}</span>`).join('<span>•</span>');updateProgress()}
async function loadTimes(){try{if(location.protocol!=='file:'){const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(CONFIG.city)}&country=${encodeURIComponent(CONFIG.country)}&method=${CONFIG.method}`,{cache:'no-store'});const j=await r.json();if(j?.data?.timings){const t=j.data.timings;timings={Fajr:clean(t.Fajr),Sunrise:clean(t.Sunrise),Dhuhr:clean(t.Dhuhr),Asr:clean(t.Asr),Maghrib:clean(t.Maghrib),Isha:clean(t.Isha)};lastUpdated=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}}}catch(e){lastUpdated='Offline'}render()}
async function playAthan(){try{const a=$('athan');a.currentTime=0;await a.play();toast('Azaan playing')}catch(e){toast('Tap once, then try Azaan')}}
let taps=0,timer=null;function adminTap(e){e.preventDefault();e.stopPropagation();taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,2200);if(taps>=5){taps=0;$('adminPanel').classList.add('show');clearTimeout(adminTap.t);adminTap.t=setTimeout(()=>$('adminPanel').classList.remove('show'),12000);toast('Admin opened')}}
$('adminHot').addEventListener('click',adminTap,{passive:false});$('adminHot').addEventListener('touchend',adminTap,{passive:false});
$('refreshBtn').onclick=()=>{loadTimes();toast('Prayer times refreshed')};$('testAthanBtn').onclick=playAthan;$('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
render();loadTimes();setInterval(render,1000);setInterval(loadTimes,1000*60*60);setTimeout(()=>loadTimes(),1000*60*5);
</script>
</body></html>
