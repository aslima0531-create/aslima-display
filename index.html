/* ==========================================================================
   ASLIMA V5.4 — Premium Background + Full Admin Controls
   Uses the cinematic mosque background asset directly.
   ========================================================================== */

:root{
  --v54-gold:#f1bd65;
  --v54-gold2:#d89638;
  --v54-cream:#fff1d2;
  --v54-muted:rgba(255,241,210,.72);
  --v54-green:#32e39a;
  --v54-panel:rgba(0,10,11,.54);
  --v54-border:rgba(241,189,101,.28);
  --v54-progress:0%;
}

body.v54-premium,
body.v5-mosque-default{
  margin:0!important;
  background:#020909!important;
  overflow:hidden!important;
}

body.v54-premium .pixelShiftWrap > header,
body.v54-premium .pixelShiftWrap > section,
body.v54-premium .pixelShiftWrap > .footer,
body.v5-mosque-default .pixelShiftWrap > header,
body.v5-mosque-default .pixelShiftWrap > section,
body.v5-mosque-default .pixelShiftWrap > .footer{
  opacity:0!important;
  pointer-events:none!important;
}

.v4Mosque{
  position:absolute!important;
  inset:0!important;
  z-index:39!important;
  display:none!important;
  padding:4.1vh 4.3vw 3.5vh!important;
  grid-template-columns:62% 38%!important;
  grid-template-rows:auto 1fr auto!important;
  gap:2vh 2.4vw!important;
  color:var(--v54-cream)!important;
  box-sizing:border-box!important;
  overflow:hidden!important;
  background:
    linear-gradient(90deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,.13) 42%, rgba(0,0,0,.34) 100%),
    linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.18) 76%, rgba(0,0,0,.42) 100%),
    url("assets/aslima-premium-bg.png") center center / cover no-repeat!important;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
}

body.v54-premium .v4Mosque,
body.v5-mosque-default .v4Mosque{
  display:grid!important;
}

.v4Mosque:before{
  content:""!important;
  position:absolute!important;
  inset:.7vh .55vw!important;
  border:1px solid rgba(255,255,255,.12)!important;
  border-radius:1.1vh!important;
  box-shadow:inset 0 0 0 1px rgba(241,189,101,.08), 0 0 5vh rgba(0,0,0,.35)!important;
  pointer-events:none!important;
  z-index:1!important;
}

.v4Mosque:after{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  background:radial-gradient(circle at 28% 24%, rgba(241,189,101,.08), transparent 32%), radial-gradient(circle at 64% 32%, rgba(49,227,154,.08), transparent 36%)!important;
  pointer-events:none!important;
  z-index:0!important;
  opacity:1!important;
  mix-blend-mode:screen!important;
}

.v5Stars{display:none!important}

.v4MosqueBrand{
  grid-column:1/3!important;
  display:flex!important;
  justify-content:space-between!important;
  align-items:flex-start!important;
  position:relative!important;
  z-index:2!important;
  padding:0!important;
}

/* Premium admin menu matching requested controls */
.v4DashboardPanel{
  position:absolute!important;
  right:4.3vw!important;
  bottom:5.1vh!important;

}

.v4DashboardPanel:before{

.v4DashboardPanel button{

</style>
</head>
<body class="isha">
<div class="app">
  <div class="bgMosque"></div><div class="vignette"></div><div class="stars"></div>
  <button class="adminHot" id="adminHot" aria-label="Admin"></button>
  <main class="content">
    <header class="top"><div class="brand">ASLIMA<small>أسليمة</small></div><div class="status"><div id="dateLine">TUESDAY, JUNE 30</div><div class="live">LIVE • VRIC</div></div></header>
    <section class="hero">
      <div class="clock"><span id="clockMain">11:52</span><span class="ampm" id="clockAmPm">PM</span></div>
      <div class="ornament"><span>✧</span></div>
      <div class="nextLabel">NEXT PRAYER</div><div class="nextName" id="nextName">FAJR</div>
      <div class="nextTime" id="nextTime">5:01 AM</div><div class="remaining" id="remaining">5h 08m remaining</div>
      <div class="progressWrap"><div class="track"><div class="fill"></div><div class="dot"></div></div><div class="trackLabels"><span>Fajr</span><span>Isha</span></div></div>
    </section>
    <aside class="panel" id="prayerPanel"></aside>
    <footer class="bottom"><div class="jumuah" id="jumuah"><b>Jumu’ah Prayer</b><span class="time">1:45 PM</span><span>•</span><span class="time">3:00 PM</span><span>•</span><span class="time">4:00 PM</span></div></footer>
  </main>
  <div class="adminPanel" id="adminPanel"><button id="refreshBtn">Refresh</button><button id="testAthanBtn">Azaan</button><button id="fullscreenBtn">Fullscreen</button></div>
  <div class="toast" id="toast">Ready</div>
  <audio id="athan" preload="auto" crossorigin="anonymous"><source src="https://praytimes.org/audio/sunni/Adhan-Madinah.mp3" type="audio/mpeg"></audio>
</div>
<script>
const CONFIG={city:'Irving',country:'United States',method:2,jumuah:['1:45 PM','3:00 PM','4:00 PM']};
const DEMO={Fajr:'05:01',Sunrise:'06:23',Dhuhr:'13:32',Asr:'17:14',Maghrib:'20:40',Isha:'22:02'};
let timings={...DEMO}, lastUpdated='', fired='', demoNow=null;
const PRAYERS=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const ICONS={Fajr:'☀',Dhuhr:'☼',Asr:'☼',Maghrib:'☀',Isha:'☾'};
const $=id=>document.getElementById(id);
function now(){return demoNow?new Date(demoNow):new Date()}
function clean(t){const m=String(t||'').match(/\d{1,2}:\d{2}/);return m?m[0]:'00:00'}
function mins(t){let [h,m]=clean(t).split(':').map(Number);return h*60+m}
function to12(t){let [h,m]=clean(t).split(':').map(Number);const p=h>=12?'PM':'AM';h=h%12||12;return {text:`${h}:${String(m).padStart(2,'0')}`,period:p,full:`${h}:${String(m).padStart(2,'0')} ${p}`}}
function getNext(){const n=now(),cur=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;let best=9999,name='Fajr';PRAYERS.forEach(p=>{let d=mins(timings[p])-cur;if(d>0&&d<best){best=d;name=p}});if(best===9999){best=1440-cur+mins(timings.Fajr);name='Fajr'}return {name,seconds:Math.max(0,Math.floor(best*60))}}
function activePrayer(nextName){const i=PRAYERS.indexOf(nextName);return i<=0?'Isha':PRAYERS[i-1]}
function remaining(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>0)return `${h}h ${String(m).padStart(2,'0')}m remaining`;if(m>0)return `${m}m remaining`;return 'starting now'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function updateProgress(){try{const n=now(),cur=n.getHours()*60+n.getMinutes()+n.getSeconds()/60,start=mins(timings.Fajr),end=mins(timings.Isha);let pct=((cur-start)/Math.max(1,end-start))*100;pct=Math.max(0,Math.min(100,pct));document.documentElement.style.setProperty('--progress',pct+'%')}catch(e){document.documentElement.style.setProperty('--progress','0%')}}
function render(){const n=now(),h=n.getHours(),m=String(n.getMinutes()).padStart(2,'0');$('clockMain').textContent=`${h%12||12}:${m}`;$('clockAmPm').textContent=h>=12?'PM':'AM';$('dateLine').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}).toUpperCase();const next=getNext(),nt=to12(timings[next.name]);$('nextName').textContent=next.name.toUpperCase();$('nextTime').textContent=nt.full;$('remaining').textContent=remaining(next.seconds);document.body.className=next.name.toLowerCase();const cur=activePrayer(next.name);$('prayerPanel').innerHTML=PRAYERS.map(p=>`<div class="row ${p===cur?'active':''}" data-name="${p}"><div class="icon">${ICONS[p]}</div><div class="pname">${p}</div><div class="ptime">${to12(timings[p]).full}</div></div>`).join('');$('jumuah').innerHTML='<b>Jumu’ah Prayer</b>'+CONFIG.jumuah.map(t=>`<span class="time">${t}</span>`).join('<span>•</span>');updateProgress()}
async function loadTimes(){try{if(location.protocol!=='file:'){const r=await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(CONFIG.city)}&country=${encodeURIComponent(CONFIG.country)}&method=${CONFIG.method}`,{cache:'no-store'});const j=await r.json();if(j?.data?.timings){const t=j.data.timings;timings={Fajr:clean(t.Fajr),Sunrise:clean(t.Sunrise),Dhuhr:clean(t.Dhuhr),Asr:clean(t.Asr),Maghrib:clean(t.Maghrib),Isha:clean(t.Isha)};lastUpdated=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}}}catch(e){lastUpdated='Offline'}render()}
async function playAthan(){try{const a=$('athan');a.currentTime=0;await a.play();toast('Azaan playing')}catch(e){toast('Tap once, then try Azaan')}}
let taps=0,timer=null;function adminTap(e){e.preventDefault();e.stopPropagation();taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,2200);if(taps>=5){taps=0;$('adminPanel').classList.add('show');clearTimeout(adminTap.t);adminTap.t=setTimeout(()=>$('adminPanel').classList.remove('show'),12000);toast('Admin opened')}}
$('adminHot').addEventListener('click',adminTap,{passive:false});$('adminHot').addEventListener('touchend',adminTap,{passive:false});
$('refreshBtn').onclick=()=>{loadTimes();toast('Prayer times refreshed')};$('testAthanBtn').onclick=playAthan;$('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
render();loadTimes();setInterval(render,1000);setInterval(loadTimes,1000*60*60);setTimeout(()=>loadTimes(),1000*60*5);

/* ASLIMA V5.4 — stable premium renderer + admin audio controls */
(function(){
  const P=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
  const $=id=>document.getElementById(id);

  function forceMode(){
    document.body.classList.remove('v5-mosque-default','v4-mosque-default');
    document.body.classList.add('v54-premium');
  }

  function clockHTML(){
    const d=new Date();
    let h=d.getHours();
    const m=String(d.getMinutes()).padStart(2,'0');
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    return `${h}:${m}<span class="v54AmPm">${ap}</span>`;
  }

  function dateText(){
    try{return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date()).toUpperCase()}
    catch(e){return new Date().toDateString().toUpperCase()}
  }

  function timeFull(name){
    try{return to12(timings[name]||DEMO[name]).full}catch(e){return '--:--'}
  }

  function nextSafe(){
    try{return getNext()}catch(e){return {name:'Fajr',seconds:0}}
  }

  function remaining(seconds){
    seconds=Math.max(0,Math.floor(Number(seconds)||0));
    const h=Math.floor(seconds/3600);
    const m=Math.floor((seconds%3600)/60);
    if(h>0)return `${h}h ${String(m).padStart(2,'0')}m remaining`;
    if(m>0)return `${m}m remaining`;
    return 'starting now';
  }

  function active(nextName){
    const i=P.indexOf(nextName);
    if(i<0)return null;
    return i===0?'Isha':P[i-1];
  }

  function progress(){
    try{
      const now=new Date();
      const cur=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
      const start=mins(timings.Fajr), end=mins(timings.Isha);
      const pct=Math.max(0,Math.min(100,((cur-start)/Math.max(1,end-start))*100));
      document.documentElement.style.setProperty('--v54-progress',pct+'%');
      document.documentElement.style.setProperty('--v5-day-progress',pct+'%');
    }catch(e){
      document.documentElement.style.setProperty('--v54-progress','0%');
    }
  }

  function renderV54(){
    forceMode();
    const n=nextSafe();
    const c=$('v4Clock'); if(c)c.innerHTML=clockHTML();
    const h=$('v4Hint'); if(h)h.firstChild && (h.firstChild.textContent=dateText());
    const next=$('v4NextPrayer'); if(next)next.textContent=(n.name||'Fajr').toUpperCase();
    const nt=$('v4NextTime'); if(nt)nt.textContent=timeFull(n.name||'Fajr');
    const rem=$('v4RemainingMain'); if(rem)rem.textContent=remaining(n.seconds);
    P.forEach(name=>{const el=$('v4'+name); if(el)el.textContent=timeFull(name)});
    const cur=active(n.name);
    document.querySelectorAll('.v4TimeRow').forEach(row=>row.classList.toggle('current',row.dataset.prayer===cur));
    const j=$('v4Jumuah');
    if(j){
      const times=(window.CONFIG && CONFIG.jumuah) ? CONFIG.jumuah : ['1:45 PM','3:00 PM','4:00 PM'];
      j.innerHTML='<b>Jumu’ah Prayer</b><span>'+times.join('</span><span>•</span><span>')+'</span>';
    }
    progress();
    updateVolumeLabel();
  }

  function updateVolumeLabel(){
    const audio=document.getElementById('athan');
    const el=$('v54VolumePct');
    if(audio && el)el.textContent=Math.round((audio.volume||0)*100)+'%';
  }

  function setVol(delta){
    const audio=document.getElementById('athan');
    if(!audio)return;
    audio.volume=Math.max(0,Math.min(1,(audio.volume||0.7)+delta));
    audio.muted=false;
    updateVolumeLabel();
    try{showToast('Volume '+Math.round(audio.volume*100)+'%')}catch(e){}
  }

  function stopAzaanNow(){
    const audio=document.getElementById('athan');
    if(audio){
      audio.pause();
      audio.currentTime=0;
    }
    try{stopGlow()}catch(e){}
    try{document.body.classList.remove('adhan-overlay-active')}catch(e){}
    const overlay=document.getElementById('adhanMode');
    if(overlay)overlay.classList.remove('show');
    try{showToast('Azaan stopped')}catch(e){}
  }

  function showAdmin(){
    const p=$('v4DashboardPanel');
    if(!p)return;
    p.classList.add('show');
    clearTimeout(window.__v54AdminTimer);
    window.__v54AdminTimer=setTimeout(()=>p.classList.remove('show'),15000);
  }

  function bindAdmin(){
    let taps=0, timer=null;
    function tap(e){
      if(e){e.preventDefault();e.stopPropagation();}
      taps++;
      clearTimeout(timer);
      timer=setTimeout(()=>taps=0,2300);
      if(taps>=5){taps=0;showAdmin();}
    }

    ['v4AdminHotspot','v4Logo'].forEach(id=>{
      const el=$(id);
      if(el && !el.__v54Tap){
        el.__v54Tap=true;
        el.addEventListener('click',tap,{passive:false});
        el.addEventListener('touchend',tap,{passive:false});
      }
    });

    const test=$('v4Azaan');
    if(test && !test.__v54){
      test.__v54=true;
      test.onclick=function(){try{playAzaan()}catch(e){} showAdmin();};
    }

    const stop=$('v54StopAzaan');
    if(stop && !stop.__v54){
      stop.__v54=true;
      stop.onclick=function(){stopAzaanNow(); showAdmin();};
    }

    const down=$('v54VolDown');
    if(down && !down.__v54){
      down.__v54=true;
      down.onclick=function(){setVol(-0.1); showAdmin();};
    }

    const up=$('v54VolUp');
    if(up && !up.__v54){
      up.__v54=true;
      up.onclick=function(){setVol(0.1); showAdmin();};
    }

    const ref=$('v4Refresh');
    if(ref && !ref.__v54){
      ref.__v54=true;
      ref.onclick=function(){try{loadTimes()}catch(e){} showAdmin();};
    }

    const dash=$('v4ShowDashboard');
    if(dash && !dash.__v54){
      dash.__v54=true;
      dash.onclick=function(){
        document.body.classList.remove('v54-premium');
        const p=$('v4DashboardPanel'); if(p)p.classList.remove('show');
        setTimeout(()=>document.body.classList.add('v54-premium'),15000);
      };
    }
  }

  const oldRender=typeof render==='function'?render:null;
  if(oldRender && !window.__v54RenderWrapped){
    window.__v54RenderWrapped=true;
    render=function(){
      oldRender();
      setTimeout(renderV54,0);
    };
  }

  bindAdmin();
  renderV54();
  setInterval(renderV54,1000);
  window.addEventListener('load',()=>setTimeout(()=>{bindAdmin();renderV54()},250));
})();

</script>
<div class="v4DashboardPanel" id="v4DashboardPanel">
  <button type="button" id="v4Azaan">Test Azaan</button>

  <div class="v54Volume">
    <div class="v54VolumeLabel">Volume</div>
    <button type="button" id="v54VolDown">−</button>
    <div class="v54VolumePct" id="v54VolumePct">70%</div>
    <button type="button" id="v54VolUp">+</button>
  </div>
  <button type="button" id="v4Refresh">Refresh Times</button>
  <button type="button" id="v4ShowDashboard">Dashboard 15s</button>
</div></body></html>
